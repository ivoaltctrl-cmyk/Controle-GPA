<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 30 850 345" width="100%" height="100%">
  <defs>
    <style>
      .wfs-red { fill: #E21B23; }
      .wfs-wordmark {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 215px;
        fill: #E21B23;
      }
      .wfs-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 32px;
        letter-spacing: 0.14em;
        fill: #E21B23;
      }
    </style>
  </defs>

  <g id="wfs-logo">
    <!-- WFS Vortex Symbol -->
    <g transform="translate(60, 45)">
      <!-- Outer crescent swoosh -->
      <path class="wfs-red" d="M 205,45 C 295,45 365,115 365,205 C 365,272 324,328 262,352 C 235,362 205,368 175,368 C 242,355 298,300 298,230 C 298,158 238,98 165,98 C 108,98 62,128 40,174 C 52,100 122,45 205,45 Z" />
      
      <!-- Inner crescent swoosh -->
      <path class="wfs-red" d="M 205,365 C 115,365 45,295 45,205 C 45,138 86,82 148,58 C 175,48 205,42 235,42 C 168,55 112,110 112,180 C 112,252 172,312 245,312 C 302,312 348,282 370,236 C 358,310 288,365 205,365 Z" />
    </g>

    <!-- wfs text wordmark -->
    <text x="455" y="278" class="wfs-wordmark" letter-spacing="-0.04em">wfs</text>

    <!-- A SATS COMPANY subtext -->
    <text x="465" y="338" class="wfs-sub">A SATS COMPANY</text>
  </g>
</svg>
